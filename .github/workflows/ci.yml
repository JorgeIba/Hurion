name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Go Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Run Backend Tests
        run: make test

  frontend-check:
    name: Web Frontend Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'web/pnpm-lock.yaml'

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Build Web UI
        run: pnpm check

      - name: Run Frontend Tests (if configured)
        run: pnpm run --if-present test

  dockerfile-check:
    name: Dockerfile Dry-Run Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Dry-Run Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: hurion-bot:ci-dry-run
