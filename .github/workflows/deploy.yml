name: CD - Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (e.g., latest or sha-xxxxxxx for rollback)'
        required: true
        default: 'latest'
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Publish Container (GHCR)
    runs-on: ubuntu-latest
    if: ${{ inputs.image_tag == 'latest' || inputs.image_tag == '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vm:
    name: Deploy to Azure VM
    needs: build-and-push
    if: ${{ always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_VM_DEPLOY_CREDENTIALS || secrets.AZURE_CREDENTIALS }}
    steps:
      - name: Azure Login
        id: azure_login
        uses: azure/login@v2
        if: env.AZURE_CREDENTIALS != ''
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Invoke Remote Update on Azure VM
        if: ${{ steps.azure_login.outcome == 'success' }}
        uses: azure/cli@v2
        with:
          inlineScript: |
            RESOURCE_GROUP="${{ vars.AZURE_RESOURCE_GROUP || 'Hurion-RG-MX' }}"
            VM_NAME="${{ vars.AZURE_VM_NAME || 'hurion-bot' }}"
            DEPLOY_TAG="${{ inputs.image_tag || 'latest' }}"
            IMAGE_URI="${{ env.REGISTRY }}/${{ github.repository }}:$DEPLOY_TAG"

            echo "==> Preparing deployment for image: $IMAGE_URI"

            VM_SCRIPT=$(cat <<EOF
            cd /hurion/app
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            sudo IMAGE_NAME="$IMAGE_URI" docker compose pull
            sudo IMAGE_NAME="$IMAGE_URI" docker compose up -d
            sudo docker logout ghcr.io
            EOF
            )

            echo "==> Invoking remote update on VM '$VM_NAME' in '$RESOURCE_GROUP'..."
            az vm run-command invoke \
              --resource-group "$RESOURCE_GROUP" \
              --name "$VM_NAME" \
              --command-id RunShellScript \
              --scripts "$VM_SCRIPT"

            echo "==> Production container updated to '$IMAGE_URI' successfully!"

      - name: Deployment Notice (Manual / Pre-Secret Setup)
        if: ${{ steps.azure_login.outcome != 'success' }}
        run: |
          echo "Notice: AZURE_CREDENTIALS secret is not configured in GitHub Secrets."
          echo "The Docker image was successfully built and published to GHCR:"
          echo "  ${{ env.REGISTRY }}/${{ github.repository }}:${{ inputs.image_tag || 'latest' }}"
