services:
  service:
    build: .
    env_file:
      - .env
    environment:
      - DB_PATH=/huron-bot/data/db.sqlite
    volumes:
      - ./local-backups:/huron-bot/local-backups
    restart: unless-stopped
    image: huron-problem-checker-bot:local
    pull_policy: never
    stop_grace_period: 60s
