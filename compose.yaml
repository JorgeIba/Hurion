services:
  service:
    build: .
    env_file:
      - .env
    environment:
      - DB_PATH=/hurion/data/db.sqlite
    volumes:
      - ./local-backups:/hurion/local-backups
      - ./config.yaml:/hurion/config.yaml
    restart: unless-stopped
    image: hurion:local
    pull_policy: never
    command: ["--seed"]
    stop_grace_period: 60s
