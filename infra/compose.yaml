# Production configuration for Azure VM
services:
  service:
    image: ${IMAGE_NAME}
    pull_policy: always
    env_file:
      - .env
    environment:
      - DB_PATH=/hurion/data/db.sqlite
      - GOMEMLIMIT=400MiB
    volumes:
      - /hurion/data:/hurion/data
    restart: unless-stopped
    stop_grace_period: 60s
